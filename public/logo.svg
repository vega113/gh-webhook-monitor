<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- GitHub Webhook Icon (Blue) -->
  <g id="webhook">
    <!-- Webhook connector base -->
    <circle cx="50" cy="100" r="20" fill="#0366d6" opacity="0.8"/>
    <!-- Webhook lines -->
    <line x1="70" y1="100" x2="100" y2="100" stroke="#0366d6" stroke-width="3"/>
    <circle cx="120" cy="100" r="12" fill="#0366d6"/>
    <line x1="120" y1="88" x2="120" y2="60" stroke="#0366d6" stroke-width="2"/>
    <line x1="120" y1="112" x2="120" y2="140" stroke="#0366d6" stroke-width="2"/>
  </g>

  <!-- AI Spark (Purple) -->
  <g id="spark">
    <!-- Central spark point -->
    <circle cx="150" cy="70" r="8" fill="#9d4edd"/>
    <!-- Spark rays -->
    <line x1="150" y1="50" x2="150" y2="35" stroke="#9d4edd" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="150" y1="90" x2="150" y2="105" stroke="#9d4edd" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="170" y1="70" x2="185" y2="70" stroke="#9d4edd" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="130" y1="70" x2="115" y2="70" stroke="#9d4edd" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Diagonal rays -->
    <line x1="165" y1="55" x2="176" y2="44" stroke="#9d4edd" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="135" y1="85" x2="124" y2="96" stroke="#9d4edd" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="165" y1="85" x2="176" y2="96" stroke="#9d4edd" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="135" y1="55" x2="124" y2="44" stroke="#9d4edd" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>